name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # Fix: The previous workflow used npm install, which can modify package-lock.json.
      # We now use npm ci to ensure a clean, reproducible installation of dependencies.
      - name: Install dependencies
        run: npm ci

      # Fix: The previous workflow had a separate 'test' job that lacked 'needs: install' and a checkout step.
      # By combining install and test into one sensible sequential job, we ensure tests
      # run only after dependencies are successfully installed and available in the workspace.
      - name: Run tests
        run: npm test
